# Generated by iglass 1.6.1 (https://github.com/vukkt/iglass): settings for Warp.
# Copy iglass-dark.yaml and iglass-light.yaml into ~/.warp/themes,
# then merge these lines into ~/.warp/settings.toml (or run: iglass install --terminal warp).

[appearance.themes]
theme = { custom = { name = "iglass Dark", path = "iglass-dark.yaml" } }
system_theme = true
selected_system_themes = { light = { custom = { name = "iglass Light", path = "iglass-light.yaml" } }, dark = { custom = { name = "iglass Dark", path = "iglass-dark.yaml" } } }

[appearance.window]
override_opacity = 66
override_blur = 24

[appearance.cursor]
cursor_display_type = "bar"
