name: Release

# When a release is published, brings the Homebrew tap (github.com/vukkt/homebrew-tap) up to
# date: fills in packaging/homebrew/iglass.rb with the release's url and sha256, checks the
# formula with brew audit, install and test, then pushes it to the tap. It writes to the tap
# with a deploy key that can write to that one repository; the key is a secret of the
# homebrew-tap environment, which only release tags and main can use. Then it points the
# portfolio at the release (the portfolio job below).
#
# Autopilot starts it for the releases it publishes, and again when the tap or the portfolio are
# behind. To redo it by hand (e.g. after fixing the formula): Actions › Release › Run workflow.
# Both jobs change only what's out of date, so running it again is harmless.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to put in the tap, e.g. v1.7.0
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  homebrew:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: macos-15
    timeout-minutes: 20
    environment: homebrew-tap
    defaults:
      run:
        # bash -eo pipefail: a download that fails inside a pipeline stops the step there.
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # The formula is edited in the tap's checkout; an update would stash it away.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check the tag is this version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a release tag: $TAG"; exit 1; }
          version=${TAG#v}
          grep -qx "IGLASS_VERSION=\"$version\"" bin/iglass ||
            { echo "::error::bin/iglass at $TAG is not version $version"; exit 1; }
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Fill in the formula
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          sha=$(curl -fsSL --retry 3 "$url" | shasum -a 256 | cut -d' ' -f1)
          sed -e "s|^  url \".*\"$|  url \"$url\"|" -e "s|^  sha256 \".*\"$|  sha256 \"$sha\"|" \
            packaging/homebrew/iglass.rb >"$RUNNER_TEMP/iglass.rb"
          grep -qxF "  url \"$url\"" "$RUNNER_TEMP/iglass.rb"
          grep -qxF "  sha256 \"$sha\"" "$RUNNER_TEMP/iglass.rb"
          echo "iglass $VERSION: $url, sha256 $sha"

      - name: Check it with brew audit, install and test
        run: |
          brew tap vukkt/tap
          cp "$RUNNER_TEMP/iglass.rb" "$(brew --repository vukkt/tap)/Formula/iglass.rb"
          brew trust --formula vukkt/tap/iglass
          brew audit --strict --online vukkt/tap/iglass
          brew install vukkt/tap/iglass
          brew test vukkt/tap/iglass
          [[ "$(iglass --version)" == "iglass $VERSION" ]]

      - name: Push it to the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n "$TAP_DEPLOY_KEY" ]] || { echo "::error::The homebrew-tap environment has no TAP_DEPLOY_KEY secret."; exit 1; }
          title=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
          mkdir -p ~/.ssh
          # GitHub's SSH host keys, from its API over HTTPS rather than trusted on first use. Asked
          # with the workflow's token: runners share addresses, and calls without one run into
          # the API's rate limit (a 403, which left no keys and failed the 1.7.1 release's first run).
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >~/.ssh/known_hosts
          [[ -s ~/.ssh/known_hosts ]] || { echo "::error::Could not get GitHub's SSH host keys."; exit 1; }
          (umask 077 && printf '%s\n' "$TAP_DEPLOY_KEY" >"$RUNNER_TEMP/tap-key")
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap-key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:vukkt/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cp "$RUNNER_TEMP/iglass.rb" Formula/iglass.rb
          if git diff --quiet; then
            echo "The tap already has this formula."
          else
            git -c user.name="$GITHUB_ACTOR" -c user.email="$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com" \
              commit -qam "${title:-iglass $VERSION}"
            git push -q origin HEAD
            echo "Pushed iglass $VERSION to the tap: $(git rev-parse --short HEAD)"
          fi
          rm -f "$RUNNER_TEMP/tap-key"

  # Then the portfolio (github.com/vukkt/vuk-portfolio): its "Latest release" line and the
  # version on the iglass card (tools/portfolio-release.sh). It deploys itself on push. Writes
  # with a deploy key that can write to that one repository, a secret of the portfolio
  # environment, which only release tags and main can use. Only for the latest release.
  portfolio:
    needs: homebrew
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: portfolio
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the portfolio
        env:
          PORTFOLIO_DEPLOY_KEY: ${{ secrets.PORTFOLIO_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n "$PORTFOLIO_DEPLOY_KEY" ]] || { echo "::error::The portfolio environment has no PORTFOLIO_DEPLOY_KEY secret."; exit 1; }
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ "$TAG" == "$latest" ]] || { echo "$TAG isn't the latest release ($latest); the portfolio stays as it is."; exit 0; }
          IFS=$'\t' read -r title published < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,publishedAt --jq '[.name, .publishedAt] | @tsv')
          mkdir -p ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >~/.ssh/known_hosts
          [[ -s ~/.ssh/known_hosts ]] || { echo "::error::Could not get GitHub's SSH host keys."; exit 1; }
          (umask 077 && printf '%s\n' "$PORTFOLIO_DEPLOY_KEY" >"$RUNNER_TEMP/portfolio-key")
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/portfolio-key -o IdentitiesOnly=yes"
          git clone -q --depth 1 git@github.com:vukkt/vuk-portfolio.git "$RUNNER_TEMP/portfolio"
          line=$(tools/portfolio-release.sh "$RUNNER_TEMP/portfolio" "$TAG" "$title" "$published")
          cd "$RUNNER_TEMP/portfolio"
          if git diff --quiet; then
            echo "The portfolio already says: $line"
          else
            # The site reads a module generated from the content file; build it to be sure it
            # still builds before it goes live.
            node .skills/vuk-portfolio/scripts/sync_portfolio.cjs
            npm ci --no-audit --no-fund
            npm run build
            git add .skills/vuk-portfolio/data/portfolio_content.json src/data/portfolio.ts
            git -c user.name="$GITHUB_ACTOR" -c user.email="$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com" \
              commit -qm "Update iglass to ${TAG#v}"
            git push -q origin HEAD
            echo "The portfolio now says: $line ($(git rev-parse --short HEAD))"
          fi
          rm -f "$RUNNER_TEMP/portfolio-key"
