name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well: the checks run against the latest Warp, Ghostty and kitty, so a release of
  # one that breaks iglass shows up without waiting for the next push. The weekly run also
  # records what it checked (docs/tested-with.md) and checks that Autopilot is running.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # macOS 15+ ships /usr/bin/jq, plutil and defaults: the same tools iglass uses at runtime.
    runs-on: macos-15
    timeout-minutes: 20
    # What this job checked, for docs/tested-with.md.
    outputs:
      macos: ${{ steps.versions.outputs.macos }}
      kitty: ${{ steps.versions.outputs.kitty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # fish for its completion tests; zsh ships with macOS.
      - name: Install lint and test tools
        run: brew install shellcheck bats-core fish

      # The real kitty, so its own config parser checks what iglass generates.
      - name: Install kitty
        continue-on-error: true
        run: brew install --cask kitty && /Applications/kitty.app/Contents/MacOS/kitty --version

      - name: Tool versions
        run: |
          sw_vers
          bash --version | head -1
          jq --version
          python3 --version
          shellcheck --version | head -2
          bats --version
          zsh --version
          fish --version

      - name: Lint
        run: make lint

      - name: Generated files are up to date
        run: make check-generated

      - name: Tests
        run: make test

      - name: Versions checked
        id: versions
        run: |
          echo "macos=$(sw_vers -productVersion)" >>"$GITHUB_OUTPUT"
          kitty=$(/Applications/kitty.app/Contents/MacOS/kitty --version 2>/dev/null | awk '{print $2}') || true
          echo "kitty=$kitty" >>"$GITHUB_OUTPUT"

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # What this job checked, for docs/tested-with.md.
    outputs:
      ubuntu: ${{ steps.versions.outputs.ubuntu }}
      ghostty: ${{ steps.versions.outputs.ghostty }}
      kitty: ${{ steps.versions.outputs.kitty }}
      warp: ${{ steps.versions.outputs.warp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lint and test tools
        run: |
          sudo apt-get update
          # gawk, the awk most desktop distros use, instead of Ubuntu's default mawk; zsh and fish
          # for their completion tests.
          sudo apt-get install -y jq shellcheck bats gawk zsh fish python3-jsonschema python3-yaml
          awk --version | head -1

      # Ghostty has no official Ubuntu package; the Snap is the easiest way to get the real
      # validator. If it can't be installed, the steps that need it say so and are skipped.
      - name: Install Ghostty
        id: ghostty
        continue-on-error: true
        run: |
          sudo snap install ghostty --classic
          ghostty --version

      # kitty's latest official release, checked against the SHA-256 GitHub publishes for it.
      # Always the latest, like Warp and the Ghostty Snap, so nobody has to bump a version here.
      - name: Install kitty
        id: kitty
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r url digest < <(gh api repos/kovidgoyal/kitty/releases/latest --jq \
            '.assets[] | select(.name | test("^kitty-[0-9.]+-x86_64\\.txz$")) | "\(.browser_download_url) \(.digest)"')
          case $digest in sha256:?*) ;; *) echo "No SHA-256 published for '$url'"; exit 1 ;; esac
          curl -fsSL -o "$RUNNER_TEMP/kitty.txz" "$url"
          echo "${digest#sha256:}  $RUNNER_TEMP/kitty.txz" | sha256sum -c -
          sudo mkdir -p /opt/kitty && sudo tar -xJf "$RUNNER_TEMP/kitty.txz" -C /opt/kitty
          sudo ln -sf /opt/kitty/bin/kitty /usr/local/bin/kitty
          kitty --version

      # Warp's current Linux release, unpacked but not installed (no package scripts run): iglass
      # finds warp-terminal and the settings schema Warp ships next to it, and the checks below
      # validate what iglass writes against that schema. Always the latest release, so a
      # setting Warp renames shows up here first.
      - name: Get Warp
        id: warp
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/warp.deb" 'https://app.warp.dev/download?package=deb'
          dpkg-deb -f "$RUNNER_TEMP/warp.deb" Version
          dpkg-deb -x "$RUNNER_TEMP/warp.deb" "$RUNNER_TEMP/warp"
          test -f "$RUNNER_TEMP/warp/opt/warpdotdev/warp-terminal/resources/settings_schema.json"

      - name: Tool versions
        run: |
          cat /etc/os-release | head -2
          bash --version | head -1
          jq --version
          python3 --version
          shellcheck --version | head -2
          bats --version
          zsh --version
          fish --version

      - name: Lint
        run: make lint

      - name: Generated files are up to date
        run: make check-generated

      - name: Tests
        run: make test

      - name: End to end with the real Ghostty
        if: steps.ghostty.outcome == 'success'
        run: |
          export HOME="$RUNNER_TEMP/home"
          unset XDG_CONFIG_HOME XDG_STATE_HOME
          mkdir -p "$HOME/.config/ghostty"
          printf 'font-size = 13\n# mine' >"$HOME/.config/ghostty/config"
          cp "$HOME/.config/ghostty/config" "$RUNNER_TEMP/original"
          ./install.sh --local
          iglass=$HOME/.local/bin/iglass
          "$iglass" install --variant clear --accent purple --window no-titlebar
          grep -qxF "config-file = ?\"$HOME/.config/ghostty/iglass.ghostty\"" "$HOME/.config/ghostty/config"
          ghostty +validate-config
          "$iglass" doctor
          "$iglass" status
          "$iglass" uninstall
          cmp "$HOME/.config/ghostty/config" "$RUNNER_TEMP/original"
          echo "Config restored byte for byte."

      - name: End to end with the real kitty
        if: steps.kitty.outcome == 'success'
        run: |
          export HOME="$RUNNER_TEMP/khome" XDG_CURRENT_DESKTOP=KDE
          unset XDG_CONFIG_HOME XDG_STATE_HOME KITTY_CONFIG_DIRECTORY
          mkdir -p "$HOME/.config/kitty"
          printf 'font_size 13\n# mine' >"$HOME/.config/kitty/kitty.conf"
          printf '# my own dark theme\nbackground #101010\n' >"$HOME/.config/kitty/dark-theme.auto.conf"
          cp "$HOME/.config/kitty/kitty.conf" "$RUNNER_TEMP/kitty-original"
          cp "$HOME/.config/kitty/dark-theme.auto.conf" "$RUNNER_TEMP/kitty-theme-original"
          ./install.sh --local
          iglass=$HOME/.local/bin/iglass
          "$iglass" install --terminal kitty --variant clear --accent purple --window no-titlebar
          grep -qxF "include $HOME/.config/kitty/iglass.conf" "$HOME/.config/kitty/kitty.conf"
          "$iglass" doctor
          "$iglass" status
          "$iglass" uninstall --terminal kitty
          cmp "$HOME/.config/kitty/kitty.conf" "$RUNNER_TEMP/kitty-original"
          cmp "$HOME/.config/kitty/dark-theme.auto.conf" "$RUNNER_TEMP/kitty-theme-original"
          echo "kitty config and theme restored byte for byte."

      - name: End to end with the real Warp's settings schema
        if: steps.warp.outcome == 'success'
        run: |
          export HOME="$RUNNER_TEMP/whome" XDG_CURRENT_DESKTOP=Hyprland
          export IGLASS_WARP_BIN="$RUNNER_TEMP/warp/opt/warpdotdev/warp-terminal/warp"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME
          schema="$RUNNER_TEMP/warp/opt/warpdotdev/warp-terminal/resources/settings_schema.json"
          settings="$HOME/.config/warp-terminal/settings.toml"
          mkdir -p "$(dirname "$settings")"
          printf '# mine\n[appearance.text]\nfont_size = 14.0\n\n[appearance.themes]\ntheme = "dracula"' >"$settings"
          cp "$settings" "$RUNNER_TEMP/warp-original"
          ./install.sh --local
          iglass=$HOME/.local/bin/iglass
          for look in "--variant clear --accent purple" "--appearance light --cursor box" "--opacity 0.7 --blur 30"; do
            "$iglass" install --terminal warp $look
            python3 tools/check_warp.py "$schema" "$settings" "$HOME"/.local/share/warp-terminal/themes/*.yaml
          done
          # The macOS settings (with blur) and the prebuilt files, against the same schema.
          IGLASS_PLATFORM=macos "$iglass" export --terminal warp --dir "$RUNNER_TEMP/warp-mac"
          python3 tools/check_warp.py "$schema" "$RUNNER_TEMP/warp-mac/iglass-settings.toml" "$RUNNER_TEMP"/warp-mac/*.yaml
          python3 tools/check_warp.py "$schema" themes/warp/iglass-settings.toml themes/warp/*.yaml
          "$iglass" doctor
          "$iglass" status
          "$iglass" uninstall --terminal warp
          cmp "$settings" "$RUNNER_TEMP/warp-original"
          echo "Warp settings restored byte for byte."

      - name: Report a skipped Warp check
        if: steps.warp.outcome != 'success'
        run: echo "::warning::Warp could not be downloaded; the real-Warp checks were skipped."

      - name: Report a skipped Ghostty check
        if: steps.ghostty.outcome != 'success'
        run: echo "::warning::Ghostty could not be installed; the real-Ghostty checks were skipped."

      - name: Report a skipped kitty check
        if: steps.kitty.outcome != 'success'
        run: echo "::warning::kitty could not be installed; the real-kitty checks were skipped."

      - name: Versions checked
        id: versions
        env:
          GHOSTTY_OK: ${{ steps.ghostty.outcome }}
          KITTY_OK: ${{ steps.kitty.outcome }}
          WARP_OK: ${{ steps.warp.outcome }}
        run: |
          . /etc/os-release && echo "ubuntu=$VERSION_ID" >>"$GITHUB_OUTPUT"
          [[ "$GHOSTTY_OK" != success ]] || echo "ghostty=$(ghostty --version | head -1 | awk '{print $2}')" >>"$GITHUB_OUTPUT"
          [[ "$KITTY_OK" != success ]] || echo "kitty=$(kitty --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"
          [[ "$WARP_OK" != success ]] || echo "warp=$(dpkg-deb -f "$RUNNER_TEMP/warp.deb" Version)" >>"$GITHUB_OUTPUT"

  # On the weekly run (or one started by hand): records what was checked in docs/tested-with.md,
  # through a PR that merges itself once CI passes on it. This is also the loop's heartbeat:
  # GitHub switches off scheduled workflows in a repository with no activity for 60 days.
  tested-with:
    needs: [macos, linux]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Propose docs/tested-with.md
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS: ${{ needs.macos.outputs.macos }}
          KITTY_MACOS: ${{ needs.macos.outputs.kitty }}
          UBUNTU: ${{ needs.linux.outputs.ubuntu }}
          GHOSTTY: ${{ needs.linux.outputs.ghostty }}
          KITTY: ${{ needs.linux.outputs.kitty }}
          WARP: ${{ needs.linux.outputs.warp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          today=$(date -u +%F)
          tools/tested-with.sh "$today" "$RUN_URL" >docs/tested-with.md
          [[ -n "$(git status --porcelain docs/tested-with.md)" ]] || { echo "Nothing changed."; exit 0; }
          branch=autopilot/tested-with
          git switch -c "$branch"
          git add docs/tested-with.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Tested with: $today"
          git push -qf origin "$branch"
          pr=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          [[ -n "$pr" ]] || pr=$(gh pr create --head "$branch" --label automerge --title "Tested with: $today" \
            --body "The versions this week's CI run checked iglass against ([run]($RUN_URL)). Merges itself once CI passes.")
          gh pr merge --auto --squash "$pr"
          # A PR opened with the workflow's token starts no workflows, so start CI on it here:
          # its macos and linux checks are what let it merge.
          gh workflow run ci.yml --ref "$branch"
          echo "Proposed in $pr"

  # Autopilot watches the other workflows every day; this watches Autopilot, every week.
  autopilot-alive:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Check Autopilot ran in the last two days, and succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/workflows/autopilot.yml"
          if [[ "$(gh api "$api" --jq .state)" == disabled_inactivity ]]; then
            gh api -X PUT "$api/enable"
            echo "::warning::GitHub had switched Autopilot off for inactivity; turned it back on."
          fi
          read -r conclusion created < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow autopilot.yml \
            --status completed --limit 1 --json conclusion,createdAt --jq '.[0] | "\(.conclusion) \(.createdAt)"')
          echo "Autopilot's last run: $conclusion, $created"
          (( $(date -u +%s) - $(date -u -d "$created" +%s) < 2 * 86400 )) ||
            { echo "::error::Autopilot hasn't run since $created."; exit 1; }
          [[ "$conclusion" == success ]] || { echo "::error::Autopilot's last run ended in $conclusion."; exit 1; }
