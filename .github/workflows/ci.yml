name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # macOS 15+ ships /usr/bin/jq, plutil and defaults: the same tools iglass uses at runtime.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lint and test tools
        run: brew install shellcheck bats-core

      # The real kitty, so its own config parser checks what iglass generates.
      - name: Install kitty
        continue-on-error: true
        run: brew install --cask kitty && /Applications/kitty.app/Contents/MacOS/kitty --version

      - name: Tool versions
        run: |
          sw_vers
          bash --version | head -1
          jq --version
          python3 --version
          shellcheck --version | head -2
          bats --version

      - name: Lint
        run: make lint

      - name: Generated files are up to date
        run: make check-generated

      - name: Tests
        run: make test

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lint and test tools
        run: |
          sudo apt-get update
          # gawk, the awk most desktop distros use, instead of Ubuntu's default mawk.
          sudo apt-get install -y jq shellcheck bats gawk python3-jsonschema python3-yaml
          awk --version | head -1

      # Ghostty has no official Ubuntu package; the Snap is the easiest way to get the real
      # validator. If it can't be installed, the steps that need it say so and are skipped.
      - name: Install Ghostty
        id: ghostty
        continue-on-error: true
        run: |
          sudo snap install ghostty --classic
          ghostty --version

      # kitty 0.49.2 from its official release, checked against a pinned checksum.
      - name: Install kitty
        id: kitty
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kitty.txz" \
            https://github.com/kovidgoyal/kitty/releases/download/v0.49.2/kitty-0.49.2-x86_64.txz
          echo "d573618b911e9c461bd421b96c13c74c7f1cb2f1ac9c327818d4ff84366cf5c6  $RUNNER_TEMP/kitty.txz" | sha256sum -c -
          sudo mkdir -p /opt/kitty && sudo tar -xJf "$RUNNER_TEMP/kitty.txz" -C /opt/kitty
          sudo ln -sf /opt/kitty/bin/kitty /usr/local/bin/kitty
          kitty --version

      # Warp's current Linux release, unpacked but not installed (no package scripts run): iglass
      # finds warp-terminal and the settings schema Warp ships next to it, and the checks below
      # validate what iglass writes against that schema. Always the latest release, so a
      # setting Warp renames shows up here first.
      - name: Get Warp
        id: warp
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/warp.deb" 'https://app.warp.dev/download?package=deb'
          dpkg-deb -f "$RUNNER_TEMP/warp.deb" Version
          dpkg-deb -x "$RUNNER_TEMP/warp.deb" "$RUNNER_TEMP/warp"
          test -f "$RUNNER_TEMP/warp/opt/warpdotdev/warp-terminal/resources/settings_schema.json"

      - name: Tool versions
        run: |
          cat /etc/os-release | head -2
          bash --version | head -1
          jq --version
          python3 --version
          shellcheck --version | head -2
          bats --version

      - name: Lint
        run: make lint

      - name: Generated files are up to date
        run: make check-generated

      - name: Tests
        run: make test

      - name: End to end with the real Ghostty
        if: steps.ghostty.outcome == 'success'
        run: |
          export HOME="$RUNNER_TEMP/home"
          unset XDG_CONFIG_HOME XDG_STATE_HOME
          mkdir -p "$HOME/.config/ghostty"
          printf 'font-size = 13\n# mine' >"$HOME/.config/ghostty/config"
          cp "$HOME/.config/ghostty/config" "$RUNNER_TEMP/original"
          ./install.sh --local
          iglass=$HOME/.local/bin/iglass
          "$iglass" install --variant clear --accent purple --window no-titlebar
          grep -qxF "config-file = ?\"$HOME/.config/ghostty/iglass.ghostty\"" "$HOME/.config/ghostty/config"
          ghostty +validate-config
          "$iglass" doctor
          "$iglass" status
          "$iglass" uninstall
          cmp "$HOME/.config/ghostty/config" "$RUNNER_TEMP/original"
          echo "Config restored byte for byte."

      - name: End to end with the real kitty
        if: steps.kitty.outcome == 'success'
        run: |
          export HOME="$RUNNER_TEMP/khome" XDG_CURRENT_DESKTOP=KDE
          unset XDG_CONFIG_HOME XDG_STATE_HOME KITTY_CONFIG_DIRECTORY
          mkdir -p "$HOME/.config/kitty"
          printf 'font_size 13\n# mine' >"$HOME/.config/kitty/kitty.conf"
          printf '# my own dark theme\nbackground #101010\n' >"$HOME/.config/kitty/dark-theme.auto.conf"
          cp "$HOME/.config/kitty/kitty.conf" "$RUNNER_TEMP/kitty-original"
          cp "$HOME/.config/kitty/dark-theme.auto.conf" "$RUNNER_TEMP/kitty-theme-original"
          ./install.sh --local
          iglass=$HOME/.local/bin/iglass
          "$iglass" install --terminal kitty --variant clear --accent purple --window no-titlebar
          grep -qxF "include $HOME/.config/kitty/iglass.conf" "$HOME/.config/kitty/kitty.conf"
          "$iglass" doctor
          "$iglass" status
          "$iglass" uninstall --terminal kitty
          cmp "$HOME/.config/kitty/kitty.conf" "$RUNNER_TEMP/kitty-original"
          cmp "$HOME/.config/kitty/dark-theme.auto.conf" "$RUNNER_TEMP/kitty-theme-original"
          echo "kitty config and theme restored byte for byte."

      - name: End to end with the real Warp's settings schema
        if: steps.warp.outcome == 'success'
        run: |
          export HOME="$RUNNER_TEMP/whome" XDG_CURRENT_DESKTOP=Hyprland
          export IGLASS_WARP_BIN="$RUNNER_TEMP/warp/opt/warpdotdev/warp-terminal/warp"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME
          schema="$RUNNER_TEMP/warp/opt/warpdotdev/warp-terminal/resources/settings_schema.json"
          settings="$HOME/.config/warp-terminal/settings.toml"
          mkdir -p "$(dirname "$settings")"
          printf '# mine\n[appearance.text]\nfont_size = 14.0\n\n[appearance.themes]\ntheme = "dracula"' >"$settings"
          cp "$settings" "$RUNNER_TEMP/warp-original"
          ./install.sh --local
          iglass=$HOME/.local/bin/iglass
          for look in "--variant clear --accent purple" "--appearance light --cursor box" "--opacity 0.7 --blur 30"; do
            "$iglass" install --terminal warp $look
            python3 tools/check_warp.py "$schema" "$settings" "$HOME"/.local/share/warp-terminal/themes/*.yaml
          done
          # The macOS settings (with blur) and the prebuilt files, against the same schema.
          IGLASS_PLATFORM=macos "$iglass" export --terminal warp --dir "$RUNNER_TEMP/warp-mac"
          python3 tools/check_warp.py "$schema" "$RUNNER_TEMP/warp-mac/iglass-settings.toml" "$RUNNER_TEMP"/warp-mac/*.yaml
          python3 tools/check_warp.py "$schema" themes/warp/iglass-settings.toml themes/warp/*.yaml
          "$iglass" doctor
          "$iglass" status
          "$iglass" uninstall --terminal warp
          cmp "$settings" "$RUNNER_TEMP/warp-original"
          echo "Warp settings restored byte for byte."

      - name: Report a skipped Warp check
        if: steps.warp.outcome != 'success'
        run: echo "::warning::Warp could not be downloaded; the real-Warp checks were skipped."

      - name: Report a skipped Ghostty check
        if: steps.ghostty.outcome != 'success'
        run: echo "::warning::Ghostty could not be installed; the real-Ghostty checks were skipped."
